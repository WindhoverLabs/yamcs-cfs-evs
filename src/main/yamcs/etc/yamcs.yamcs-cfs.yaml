#TODO: Needs to be updated to work with our custom CFS configuration
services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersCollector
    args:
      provideJvmVariables: true
      provideFsVariables: true
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: false
      backFiller:
        enabled: true
        warmupTime: 60
  - class: org.yamcs.tctm.cfs.CfsEventDecoder
    args:
      msgIds: [0x0808]
  - class: org.yamcs.cfdp.CfdpService
    name: cfdp0
    args:
      inStream: cfdp_in
      outStream: cfdp_out
      localEntities:
        - name: "0.23"
          id: 23
          bucket: cfdpUp
      remoteEntities:
        - name: "0.24"
          id: 24
          bucket: cfdpDown
      receiverFaultHandlers:
        AckLimitReached: suspend

dataLinks:
  - name: evs-logs
    class: com.windhoverlabs.yamcs.cfs.evs.CfsEvsPlugin
    eventStream: events_realtime
    stream: tm_realtime
    buckets: ["cfdpDown"]
    EVS_FILE_HDR_SUBTYPE: 16
    #This is obviously discouraged since it breaks the CFE_EVS API, but it has been useful in the past when 
    #the packet does not adhere to the CFE_EVS_PacketID_t struct for some reason.
    ignoreSpacecraftID: true  #Only ignores the SpacecraftID in CFE_EVS_PacketID_t and NOT in CFE_FS_Header_t
    #This is obviously discouraged since it breaks the CFE_EVS API, but it has been useful in the past when 
    #the packet does not adhere to the CFE_EVS_PacketID_t struct for some reason.
    ignoreProcessorID: true #Only ignores the ProcessorID in CFE_EVS_PacketID_t and NOT in CFE_FS_Header_t
    deleteFileAfterProcessing: true
    csvConfig:
      mode: APPEND # APPEND, REPLACE, INACTIVE
      csvBucket: cfdpDown
      outputFile: "events_dump.csv"
      byteOrder: BIG_ENDIAN
      appNameMax: 10
      eventMsgMax: 122
    packetPreprocessorClassName: org.yamcs.tctm.cfs.CfsPacketPreprocessor
    packetPreprocessorArgs:
      byteOrder: BIG_ENDIAN
      timestampFormat: CFE_SB_TIME_32_16_SUBS
      timeEncoding:
        useLocalGenerationTime: false
        epoch: CUSTOM
        epochUTC: "1970-01-01T00:00:00Z"
        timeIncludesLeapSeconds: true
      

mdb:
    # Configuration of the active loaders
    # Valid loaders are: sheet, xtce or fully qualified name of the class
    - type: "xtce"
      spec: "mdb/cfs-ccsds.xml"
      subLoaders:
        - type: "xtce"
          spec: "mdb/cpd.xml"
        - type: "xtce"
          spec: "mdb/ppd.xml"

# Configuration for streams created at server startup
streamConfig:
  tm:
    - name: "tm_realtime"
    - name: "tm_dump"
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  tc: ["tc_realtime"]
  sqlFile: "etc/extra_streams.sql"
